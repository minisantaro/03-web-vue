<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-基本语法-输出语句</title>
</head>

<body>

    
    <script>
        //1. 写入浏览器的body区域
        document.write("Hello JS!!!!!")

        //2. 弹出框 
        window.alert("Hello JS2222!!!")
        alert("hello JS3333") //window在这里是可以省略的。

        //3. 控制台
        console.log("hello js44444!!!") // 这里有个快捷键 输入log之后 然后选log正方形就会输出console.log
        


    </script>
</body>

</html>
