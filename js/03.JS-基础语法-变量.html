<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-基础语法-变量</title>
</head>

<body>

    <script>
        // 1.let关键字来定义变量 -- 类型可变
        let a = 10;
        a = "hello"
        alert(a)

        // 2.const 关键字定义常量 -- 一旦定义完之后就不能改变
        const b = 20;
        // b = 30; 不能重复赋值
        document.write(b)

        // 早期的时候还有用var来声明变量但是他不严谨 所以现在已经很少用了。
        // 可以重复声明。比如前面写var c 后面还可以写var c
        var c = 10;
        var c = 10;

        // f12的开发者模式 
        // element就是元素 咱们写的那些代码 
        // console就是控制台 可以看到报错
        // 然后报错的蓝色下划线字母可以点进去 看报错的位置 红色的文字是报错的原因

    </script>
</body>

</html>
