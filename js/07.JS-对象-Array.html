<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-对象-Array</title>
</head>

<body>
    <script>
        //1. 定义数组   --特点：数组长度可变、类型任意
        //方式1
        let arr1 = new Array(1,2,3,4,5);
        //方式2
        let arr2 = [1,2,3,4,5];   //长度5
        arr2[10] = 'A';

        //2. 访问数组元素
        alert(arr2[0]); // 1
        alert(arr2[10]); // A 长度类型无限制

        //3. 数组的属性 -- length
        console.log(arr2);
        console.log(arr2.length);
        for (let i = 0; i < arr2.length; i++) {
            console.log(arr2[i]);
        }
        
        console.log("-----------------------------");
        
        // 4. 数组的常用方法 forEach()、map()、push()、pop()、unshift()、shift()、splice()
        // 4-1 forEach -- 循环遍历 [只会遍历有值的元素]
        arr2.forEach(element => {
            console.log(element);
        }); 

        console.log("-----------------------------");
        
        // 4-2 map -- 遍历，并且会返回一个新的数组
        let mapArr = arr2.map((element) => {
            return element + 10;
        });
        console.log(mapArr);

        // 4-3 push -- 在数组末尾添加一个或多个元素，并返回新的长度
        // 4-4 pop -- 删除数组末尾的元素，并返回删除的元素
        console.log("-----------------------------");
        arr2.push('B', 'C', 'D');
        console.log(arr2);
        arr2.pop();
        console.log(arr2);

        // 4-5 unshift -- 在数组开头添加一个或多个元素，并返回新的长度
        // 4-6 shift -- 删除数组开头的元素，并返回删除的元素
        console.log("-----------------------------");
        arr2.unshift(100, 200,  300);
        console.log(arr2);
        arr2.shift();
        console.log(arr2);

        // 4-7 splice （参数1, 参数2）-- 删除元素，制定从某个位置开始，删除几个
        // 参数1:代表要删除元素的其实索引，参数2:代表要删除的元素个数
        console.log("-----------------------------");
        // 假设要删除2 3 4
        arr2.splice(3, 3);
        console.log(arr2);

    </script>d
</body>

</html>
