<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正则表达式</title>
</head>
<body>
    <script>
        // 正则表达式 正規表現　せいきひょうげん
        // 定义了字符串组成的规则，常用来验证数据格式，查找替换文本
        let reg1 = /abc/;
        // let reg2 = new RegExp('123');

        // test方法，用来校验字符串是否符合规则
        let flag = reg1.test("aaaaaaaa"); // 看看包含不包含上面的abc false
        console.log(flag);
        console.log(reg1.test("aaabcccc"));
        
        // 需求：校验用户名（4～16位）
        // 普通字符：大多数的字符仅能描述它们本身，这些字符称作普通字符，比如字母和数字。
        // 特殊字符：是一些具有特殊含义的字符，可以极大提高了灵活性和强大的匹配功能。
        // 量词：表示要匹配的字符或表达式的数量。
        // | 符号       | 意思                         | 先记住的例子      |
        // |------------|------------------------------|-------------------|
        // | `\d`       | 数字字符 0-9                 | `/\d/`            |
        // | `\w`       | 字母、数字、下划线            | `/\w/`            |
        // | `\s`       | 空白字符                     | `/\s/`            |
        // | `[]`       | 匹配指定范围内的单个字符       | `/[0-9]/`         |
        // | `^`        | 表示以指定内容开始             | `/^abc/`          |
        // | `$`        | 表示以指定内容结束             | `/abc$/`          |
        // | `+`        | 前面的内容出现1次或多次         | `/\d+/`           |
        // | `*`        | 前面的内容出现0次或多次         | `/a*/`            |
        // | `?`        | 前面的内容出现0次或1次          | `/a?/`            |
        // | `{n}`      | 前面的内容正好出现n次           | `/\d{4}/`         |
        // | `{m,}`     | 前面的内容至少出现m次           | `/\d{4,}/`        |
        // | `{m,n}`    | 前面的内容出现m到n次            | `/\d{2,4}/`       |
        // | `.`        | 匹配任意单个字符（通常不含换行） | `/a.c/`           |

        let regName = /\w{4,16}/
        // alert(regName.test("aaa")) // false
        // alert(regName.test("abcd")) // true

        // 需求2:校验手机号(11位，纯数字，1开头，第二位3～9，后面再加9位纯数字)
        let regPhone = /^1[3-9]\d{9}$/;
        alert(regPhone.test("13199990000"))
        
    </script>
</body>
</html>
