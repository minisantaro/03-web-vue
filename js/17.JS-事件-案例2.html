<!DOCTYPE html>
<html>

<head>
    <title>表单</title>
    <style>
        label {
            display: inline-block;
            width: 80px;
            text-align: right;
            margin-right: 10px;
        }

        input {
            width: 250px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .btn {
            width: 150px;
        }

        .tip {
            color: #ff0000;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div>
        <h1>用户注册</h1>
        <form>
            用户名：
            <!-- placeholder就是input文本里面的提示信息，当我输入文本的时候这个提示信息就会消失掉的。 -->
            <input type="text" id="username" name="username" placeholder="用户名不能为空且长度在4-16个字符">
            <!-- 待会如果有错误信息，那就填写到这个span里面。 -->
            <span class="tip" id="name_msg"></span> <br> 

            手机号：
            <input type="text" id="phone" name="phone" placeholder="手机号不能为空且长度为11位">
            <span class="tip" id="phone_msg"></span>
            <br>

            <input type="submit" value="提交" class="btn">
            <input type="reset" value="重置" class="btn">
        </form>
    </div>


    <script>
        // 需求：表单校验--用户名：长度在4-16位；手机号：长度11位
        // 分析：JS事件--鼠标离焦事件blur, 表单提交事件submit,DOM操作
        // 获取dom元素
        // 1.校验用户名
        // 其实是input输入值之后，赋值给的是里面的value属性
        let input = document.querySelector('#username');
        
        input.addEventListener('blur', ()=>{
            let usernameValue = input.value;
            // alert(usernameValue);　测试代码
            // 校验用户名的长度
            if(usernameValue.length < 4 || usernameValue.length > 16){
                 document.querySelector('#name_msg').innerHTML = "用户名不合法！";
            }else{
                document.querySelector('#name_msg').innerHTML = "";
            }
        })

        
        

        // 2.校验手机号
        let inputPhone = document.querySelector('#phone');
        inputPhone.addEventListener('blur', ()=>{
            let phoneValue = inputPhone.value;
            // alert(phoneValue); 测试代码
            // 校验用户名的长度 
            // value：获取表单输入框的值，如 input、textarea。
            // innerHTML：获取普通标签内部的 HTML 内容，如 div、p,span。
            if(phoneValue.length !== 11){
                document.querySelector('#phone_msg').innerHTML = "手机号不合法！";
            }else{
                document.querySelector('#phone_msg').innerHTML = "";
            }
        })

        // 3.表单提交时，需要校验整个表单是否合法，如果不合法不让提交


    </script>
</body>

</html>
