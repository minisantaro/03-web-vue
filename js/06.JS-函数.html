<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-函数</title>
</head>

<body>
    <script>
        // 具名函数：
        // 函数的定义：Js中的函数通过function关键字来定义
        // 特点1：参数个数可以任意，但建议按照规范写。
        // 特点2：形参和返回值不需要类型
        function add(num1, num2) {
            return num1 + num2;
        }

        // 调用函数
        let result = add(10, 20);
        console.log(result); // 30
        // JavaScript 函数允许传入比形参更多的参数，但函数只使用声明的 num1 和 num2：
        let result2 = add(10,20,30);
        console.log(result2); // 30
        // JavaScript 函数允许参数数量不匹配，多余的参数会被忽略，缺少的参数默认为 undefined。
        let result3 = add(10);
        console.log(result3); // NaN

        // 匿名函数
        // 可以通过两种方式：函数表达式 和 箭头函数
        // 1.函数表达式
        let add2 = function (num1, num2) {
            return num1 + num2;
        }
        alert(add2(99, 11)); // 110
        // 2.箭头函数
        let add3 = (num1, num2) => {
            return num1 + num2;
        }
        alert(add3(23, 44)); // 67
    </script>
</body>
</html>
