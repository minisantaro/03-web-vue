<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .center {
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>

<body>
    <div class="center">
        您好, 支付完成, <span id="time">5</span> 秒之后将自动跳转至 <a href="https://www.jd.com">官网</a> 首页 ~
    </div>

    <script>
        // 需求；倒计时结束后要自动跳转到官网首页
        // 分析：要改变元素内容的话就是DOM操作，周期性的定时器，location的地址栏修改 
        // 1.获取DOM元素对象
        let span = document.querySelector('#time')//返回的是一个span对象
        let timaeValue = span.innerHTML;
        alert(timaeValue);
        // 每过一秒钟需要将时间减一
        setInterval(() => {
            timaeValue--;
            if(timaeValue <= 0){
                //进行页面跳转
                location.href = "https://www.jd.com"
            }
            span.innerHTML = timaeValue;
        }, 1000);

        // 2.操作元素内容s

    </script>
</body>

</html>
