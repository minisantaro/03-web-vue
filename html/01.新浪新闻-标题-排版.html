<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!-- 图片img
        src属性：设置要长史的图片路径
        
        绝对路径(一般不会用绝对路径)： 
            绝对磁盘路径：/Users/fire/itheima/03-web-vue/img/logo.png
            绝对网络路径：https://i2.sinaimg.cn/dy/deco/2012/0613/yocc20120613img01/news_logo.png 右键网上的图片 复制图片地址
        相对路径：./img/logo.png
                .代表当前目录
                ..代表上一级目录
        alt属性：设置图片的替代文本，图片无法显示时会显示alt的内容
        width属性：设置图片的宽度   px像素  %百分比 只写一个宽度的时候，高度也会等比例缩放 一般只设置一个
        height属性：设置图片的高度  g
    -->
    <img src="./img/logo.png" alt="logo.png" width="100px"> 新浪政务>正文

    <!-- 标题标签h1～h6 -->
    <h1>新思想引领新征程</h1>

    <!-- 水平线标签 hr (horizontal rule)-->
    <hr>
    2026年08月24日 14:00
    <hr>
</body>
