<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格</title>
</head>

    <style>
        table{
            text-align: center;   /* 设置文本居中 */
            border-collapse: collapse; /* 设置表格边框合并 */
        }
        td,th{
            border : 1px solid black; /* 设置单元格的边框样式 */
        }
        img{
            width: 30px;
        }
    </style>
<body>
    <table >
        <tr>
            <th width="50px">序号</th>
            <th width="100px">品牌logo</th>
            <th>品牌名称</th>
            <th>企业名称</th>
        </tr>
        <tr>
            <td >001</td>
            <td><img src="img/huawei.jpg" alt="品牌logo"></td>
            <td>华为</td>
            <td>华为科技有限公司</td>
        </tr>
        <tr>
            <td>002</td>
            <td><img src="img/alibaba.jpg" alt="品牌logo" ></td>
            <td>阿里</td>
            <td>阿里巴巴集团控股有限公司</td>
    </table>
</body>
</html>
