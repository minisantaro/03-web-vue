<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    div{
        height: 200px;
        width: 200px;
        background-color: aqua; /* 设置背景颜色 */
        padding: 10px 5px 15px 20px; /* 设置内边距 上右下左 就是以个顺时针的顺序 */
        border: 30px solid red;/* 设置边框的宽度和颜色 */
        margin: 20px; /* 设置外边距：一个值代表上下左右值一样*/
        box-sizing: border-box; /* 固定盒子的大小 */
    }
</style>
<body>
    <!-- div 一个div就是一行，会自动换行 -->
    <!-- <div>我是div1</div>
    <div>我是div1</div>
    <div>我是div1</div> -->

    <!-- span 行内布局 -->
    <!-- <span>我是span1</span>
    <span>我是span2</span>
    <span>我是span3</span> -->


    <div>
        哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈
    </div>

    <div>
        <!-- AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA  -->
        <!-- 这么写的话不会自动换行米因为被认作是一个单词了 -->       
         <!-- 可以通过下面的换行的方式来折叠换行。  -->
        AAAAAAAAAAAAAAAAAAAA
        AAAAAAAAAAAAAAAAAAAAA
        AAAAAAAAAAAAAAAAA
    </div>
</body>
</html>
