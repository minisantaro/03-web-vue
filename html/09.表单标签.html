<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单标签</title>
</head>
<body>
    <!-- 
        表单标签:form 
            action属性:定义提交数据的路径，不写的话提交到当前路径。
            method属性:定义表单提交方式
                get：请求数据直接拼接在后面 ?username=张三&age=18
                        大小有限制，因为直接拼接在url后面，安全性低（比如说后面站个人，不就看到密码了么）。

                post：请求数据放在请求体中，安全性高，大小没有限制。
                        查看方式：F12->network->playload->view source
                        ?username=lisi&age=18

                注意：如果要提交必须添加name属性。
    -->
    <form action="" method="get">
        姓名：<input type="text" name="username">
        年龄：<input type="text" name="age">
        <input type="submit" value="get提交数据">
    </form>
    <br>
    <form action="" method="post">
        姓名：<input type="text" name="username">
        年龄：<input type="text" name="age">
        <input type="submit" value="post提交数据">
    </form>
</body>
</html>
